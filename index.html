<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<title>FORMULA CAR RACING</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070b;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;overflow:hidden;background:#05070b}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 7px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px;z-index:20}
.hudCard{background:linear-gradient(180deg,rgba(10,15,25,.92),rgba(3,6,11,.82));border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:6px 2px;text-align:center;color:#fff;backdrop-filter:blur(8px);box-shadow:0 8px 20px #0008,inset 0 1px 0 #ffffff18}
.hudLabel{font-size:10px;color:#d7dbe4;letter-spacing:.03em}.hudValue{font-size:21px;font-weight:950;line-height:1.05;margin-top:2px}.pink{color:#ff2d82}
.progress{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 74px);height:8px;border-radius:99px;background:#ffffff35;overflow:hidden;z-index:20;border:1px solid #ffffff22}.progress>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff1f6d,#ff5aa3);box-shadow:0 0 14px #ff2d82}
.controls{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom) + 12px);display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;z-index:30}
.controls button{height:80px;border:none;border-radius:18px;font-size:18px;font-weight:950;color:#fff;background:linear-gradient(180deg,rgba(11,17,29,.96),rgba(4,8,14,.92));border:1px solid #ffffff55;box-shadow:0 10px 24px #000b,inset 0 1px 0 #ffffff1f;backdrop-filter:blur(7px);touch-action:none}
.controls button:active{transform:scale(.96)}#brake{background:linear-gradient(145deg,#2563eb,#0f2f73);font-size:15px}#brake.active{background:linear-gradient(145deg,#60a5fa,#1d4ed8);box-shadow:0 0 20px #60a5fa88,0 10px 24px #0009}#boost{background:linear-gradient(145deg,#ff2d82,#a90045);font-size:16px;box-shadow:0 0 22px #ff2d8277,0 10px 24px #0009}#boost.cooldown{background:linear-gradient(145deg,#4b5563,#1f2937);box-shadow:0 10px 24px #0009;color:#cbd5e1}
.speedMeter{position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 112px);z-index:23;width:62px;padding:8px 5px;border-radius:13px;background:linear-gradient(180deg,rgba(7,12,20,.92),rgba(3,6,11,.82));border:1px solid rgba(255,255,255,.28);box-shadow:0 8px 20px #0009;text-align:center;color:#fff;backdrop-filter:blur(7px)}.speedMeter .n{font-size:22px;font-weight:1000;line-height:1;color:#ff4c91}.speedMeter .u{font-size:9px;font-weight:900;letter-spacing:.08em;margin-top:3px;color:#d8dde6}.speedMeter.draft{box-shadow:0 0 20px #42d9ff99,0 8px 20px #0009;border-color:#63e6ff}.speedMeter.draft:after{content:"SLIP";display:block;font-size:8px;color:#7eeaff;font-weight:1000;margin-top:3px}.notice{position:absolute;top:calc(env(safe-area-inset-top) + 96px);left:50%;transform:translateX(-50%);z-index:24;background:#9f1e16ed;color:#fff;border:1px solid #ff766a;padding:9px 14px;border-radius:999px;font-weight:950;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 8px 20px #0008}.notice.show{opacity:1}
.countdown{position:absolute;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.34);pointer-events:none}.countdown.hidden{display:none}.signalBox{min-width:270px;padding:22px 20px 18px;border-radius:24px;background:linear-gradient(180deg,rgba(5,8,14,.96),rgba(10,14,22,.94));border:1px solid #ffffff44;box-shadow:0 24px 70px #000d;text-align:center;color:#fff}.signalTitle{font-size:13px;font-weight:950;letter-spacing:.18em;color:#d9dee8;margin-bottom:14px}.lights{display:flex;justify-content:center;gap:10px}.light{width:34px;height:34px;border-radius:50%;background:#2a2f38;border:3px solid #080a0f;box-shadow:inset 0 0 8px #000,0 0 0 1px #ffffff20}.light.on{background:#ff2424;box-shadow:inset 0 0 7px #fff8,0 0 20px #ff2424}.countText{height:58px;margin-top:8px;font-size:46px;line-height:58px;font-weight:1000;font-style:italic;text-shadow:0 4px 12px #000}.countText.go{color:#7dff7a;font-size:50px;text-shadow:0 0 22px #25ff63,0 4px 12px #000}.start,.result{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,rgba(2,6,12,.12),rgba(2,5,10,.92))}.hidden{display:none}
.startCard,.resultCard{width:min(92vw,430px);border-radius:26px;padding:20px;background:linear-gradient(160deg,rgba(8,13,23,.96),rgba(15,19,30,.94));border:1px solid #ffffff38;color:#fff;box-shadow:0 24px 80px #000c;text-align:center;backdrop-filter:blur(12px)}
.logo{font-size:34px;font-weight:1000;letter-spacing:-1px;font-style:italic;line-height:.95}.logo span{color:#ff2d82}.sub{font-size:12px;color:#d9dce4;margin:8px 0 12px;letter-spacing:.16em}.heroCar{height:190px;position:relative;margin:0 0 8px;filter:drop-shadow(0 18px 18px #000)}
.highScore{margin:0 0 10px;padding:9px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(255,212,64,.16),rgba(255,45,130,.12));border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:900;color:#fff}.highScore strong{color:#ffd84d;font-size:18px;margin-left:6px}.overtakeRule{margin:10px 0 12px;padding:10px 12px;border-radius:14px;background:linear-gradient(90deg,rgba(255,45,130,.17),rgba(255,154,67,.14));border:1px solid rgba(255,255,255,.18);font-size:13px;font-weight:900;line-height:1.45;color:#fff}.overtakeRule strong{color:#ff7bb1;font-size:15px}.startBtn,.retryBtn{width:100%;height:60px;border:0;border-radius:17px;background:linear-gradient(90deg,#ff2d82,#ff6aa8);font-weight:1000;font-size:21px;color:white;box-shadow:0 0 24px #ff2d8270}.how{font-size:12px;color:#d3d6df;margin-top:11px;line-height:1.55}

.difficulty{display:flex;align-items:center;gap:10px;margin:12px 0;padding:10px 12px;border-radius:14px;background:#0b1220;border:1px solid #ffffff2e}.difficulty label{font-size:13px;font-weight:950;white-space:nowrap}.difficulty select{flex:1;height:42px;border-radius:11px;border:1px solid #ffffff55;background:#111827;color:#fff;font-size:16px;font-weight:950;padding:0 12px}
.unlockNote{font-size:11px;color:#cfd4dd;margin:-3px 0 10px}
@media (max-width:390px){.controls{left:8px;right:8px;gap:5px}.controls button{font-size:14px}.controls #boost{font-size:12px}}@media (max-height:700px){.hudValue{font-size:18px}.hudCard{padding:5px 2px}.progress{top:calc(env(safe-area-inset-top) + 63px)}.controls button{height:64px}.notice{top:calc(env(safe-area-inset-top) + 84px)}.heroCar{height:150px}.startCard{padding:16px}}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>
<div class="hud">
 <div class="hudCard"><div class="hudLabel">順位</div><div id="rank" class="hudValue pink">4位</div></div>
 <div class="hudCard"><div class="hudLabel">残り</div><div id="time" class="hudValue">180.0</div></div>
 <div class="hudCard"><div class="hudLabel">スコア</div><div id="score" class="hudValue">0</div></div>
 <div class="hudCard"><div class="hudLabel">ブースト</div><div id="energy" class="hudValue">100%</div></div>
</div>
<div class="progress"><i id="bar"></i></div>
<div id="speedMeter" class="speedMeter"><div id="speedValue" class="n">0</div><div class="u">km/h</div></div>
<div id="notice" class="notice"></div>
<div id="countdown" class="countdown hidden" aria-live="assertive">
 <div class="signalBox">
  <div class="signalTitle">RACE START</div>
  <div class="lights"><i class="light"></i><i class="light"></i><i class="light"></i><i class="light"></i><i class="light"></i></div>
  <div id="countText" class="countText"></div>
 </div>
</div>
<div class="controls">
 <button id="left">◀ 左</button><button id="boost">⚡ オーバーテイクモード</button><button id="right">右 ▶</button>
</div>
<div id="start" class="start">
 <div class="startCard">
  <div class="logo"><span>FORMULA CAR</span><br>RACING</div>
  <div class="sub">TOP VIEW · 3D STYLE</div>
  <canvas id="hero" class="heroCar"></canvas>
  <div class="difficulty">
   <label for="levelSelect">難易度</label>
   <select id="levelSelect" aria-label="難易度選択"></select>
  </div>
  <div id="unlockNote" class="unlockNote">1位で次の難易度が解放されます</div>
  <div class="highScore">🏆 最高スコア <strong id="highScore">0</strong></div>
  <div class="overtakeRule"><strong>オーバーテイクモード</strong><br>10秒間使用できます。使用後は20秒間、再使用できません。<br>このルールはプレイヤーもライバル車も共通です。<br>？ボックスの「巨大化」と「スピードUP」は8秒間。巨大化中は1.5倍・速度UP・体当たり無敵。</div>
  <button id="startBtn" class="startBtn">レーススタート</button>
  <div class="how">4台で順位を争います。<br>左右でレーン移動、オーバーテイクモードで一気に追い抜け。</div>
 </div>
</div>
<div id="result" class="result hidden"><div class="resultCard"><h1 id="resultTitle">FINISH</h1><p id="resultText"></p><button id="retry" class="retryBtn">もう一度</button></div></div>
</div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),app=document.getElementById('app');
const hero=document.getElementById('hero'),hx=hero.getContext('2d');
const rankEl=document.getElementById('rank'),timeEl=document.getElementById('time'),scoreEl=document.getElementById('score'),energyEl=document.getElementById('energy'),bar=document.getElementById('bar'),notice=document.getElementById('notice'),speedValue=document.getElementById('speedValue'),speedMeter=document.getElementById('speedMeter');
const levelSelect=document.getElementById('levelSelect'),unlockNote=document.getElementById('unlockNote'),highScoreEl=document.getElementById('highScore'),countdownEl=document.getElementById('countdown'),countText=document.getElementById('countText'),signalLights=[...document.querySelectorAll('.light')];
let W=390,H=844,dpr=1,running=false,last=0,t=0,score=0,boost=0,boostCooldown=0,shake=0,crashFlash=0,nextTruck=10,truck=null,roadScroll=0,sceneryScroll=0,nextBox=3,itemBoxes=[],braking=false,curveStrength=0,curveTarget=0,curveDir=0,curveSafeSpeed=230,curvePenaltyClock=0;
let difficulty=1,unlocked=Math.max(1,Math.min(20,Number(localStorage.getItem('formulaUnlocked')||1))),highScore=Math.max(0,Number(localStorage.getItem('formulaHighScore')||0));
highScoreEl.textContent=Math.floor(highScore).toLocaleString('ja-JP');
const duration=180,lanes=4;
const player={lane:1,x:0,y:0,w:58,h:118,progress:0,speed:164,rank:4,stun:0,shield:0,itemSpeed:0,giant:0,crashSpin:0};
let rivals=[],traffic=[];
const settings={};
for(let lv=1;lv<=20;lv++){
 const p=(lv-1)/19;
 settings[lv]={
  rivalSpeedBase:161+lv*.72,
  reaction:.0032+p*.0058,
  laneAggro:.84+p*.14,
  boostChance:.0052+p*.0068,
  boostPower:80+p*18,
  catchup:8.5+p*9.5,
  traffic:Math.min(13,5+Math.floor((lv-1)/2)),
  trafficSpeed:[118+lv*.7,136+lv*1.0]
 };
}
function resize(){dpr=Math.min(2,devicePixelRatio||1);W=app.clientWidth;H=app.clientHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0);hero.width=330*dpr;hero.height=190*dpr;hx.setTransform(dpr,0,0,dpr,0,0);drawHero();player.y=H-214}
addEventListener('resize',resize);resize();
function roadGeom(y){const topY=88,bottomY=H,tt=Math.max(0,Math.min(1,(y-topY)/(bottomY-topY))),e=tt*tt*(3-2*tt);return{cx:W/2,w:W*(.42+e*.48),p:e,topY}}
function laneX(l,y=H*.6){const g=roadGeom(y);return g.cx-g.w/2+(l+.5)*(g.w/lanes)}
function updateDifficultyUI(){levelSelect.innerHTML='';for(let lv=1;lv<=20;lv++){const o=document.createElement('option');o.value=lv;o.textContent='LEVEL '+lv+(lv>unlocked?' 🔒':'');o.disabled=lv>unlocked;levelSelect.appendChild(o)}if(difficulty>unlocked)difficulty=unlocked;levelSelect.value=String(difficulty);unlockNote.textContent=unlocked<20?'1位でLEVEL '+(unlocked+1)+'が解放されます':'LEVEL 20まで全解放済み'}
levelSelect.addEventListener('change',()=>{const lv=+levelSelect.value;if(lv<=unlocked){difficulty=lv;updateDifficultyUI()}});updateDifficultyUI();
function makeRival(i){const cfg=settings[difficulty];const startRanks=[1,2,3];const rank=startRanks[i];const lane=[1,3,0][i]??i%lanes;const speed=cfg.rivalSpeedBase+(4-rank)*1.15+(i%3)*.45;const palette=['#e7bd22','#2c9cf0','#2ec27e'];return{type:'rival',lane,y:H*(.28+i*.09),progress:(4-rank)*72,speed,baseSpeed:speed,boostTime:0,boostCooldown:0,shield:0,itemSpeed:0,giant:0,color:palette[i],w:48,h:96,ace:i===0,attacker:true,attackClock:4+i*.9+Math.random()*2.5}}
function makeTraffic(i){const cfg=settings[difficulty];return{type:'traffic',lane:i%lanes,y:-120-i*105,progress:player.progress-(180+i*90),speed:cfg.trafficSpeed[0]+Math.random()*(cfg.trafficSpeed[1]-cfg.trafficSpeed[0]),baseSpeed:0,boostTime:0,boostCooldown:0,shield:0,itemSpeed:0,giant:0,color:['#6b7280','#9ca3af','#7c3aed','#ef4444','#0ea5e9'][i%5],w:42,h:84,lap:true}}
function reset(){t=0;score=0;boost=0;boostCooldown=0;shake=0;crashFlash=0;nextTruck=10;truck=null;roadScroll=0;sceneryScroll=0;nextBox=3;itemBoxes=[];braking=false;curveStrength=0;curveTarget=0;curveDir=0;curvePenaltyClock=0;player.lane=1;player.progress=0;player.stun=0;player.shield=0;player.itemSpeed=0;player.giant=0;player.crashSpin=0;rivals=Array.from({length:3},(_,i)=>makeRival(i));traffic=Array.from({length:Math.max(2,Math.floor(settings[difficulty].traffic*.45))},(_,i)=>makeTraffic(i));updateHud()}
function contenders(){return[player,...rivals]}
function updateHud(){const vals=contenders().sort((a,b)=>b.progress-a.progress);player.rank=vals.indexOf(player)+1;rankEl.textContent=player.rank+'位/4';timeEl.textContent=Math.max(0,duration-t).toFixed(1);scoreEl.textContent=Math.floor(score);const b=document.getElementById('boost');if(boost>0){energyEl.textContent=Math.ceil(boost)+'秒';b.textContent='⚡ モード中 '+Math.ceil(boost);b.classList.remove('cooldown')}else if(boostCooldown>0){energyEl.textContent=Math.ceil(boostCooldown)+'秒';b.textContent='再使用 '+Math.ceil(boostCooldown);b.classList.add('cooldown')}else{energyEl.textContent='READY';b.textContent='⚡ オーバーテイクモード';b.classList.remove('cooldown')}bar.style.width=(Math.max(0,duration-t)/duration*100)+'%'}
function show(s){notice.textContent=s;notice.classList.add('show');clearTimeout(show.tm);show.tm=setTimeout(()=>notice.classList.remove('show'),1100)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function start(){
 if(running||!countdownEl.classList.contains('hidden'))return;
 reset();document.getElementById('start').classList.add('hidden');document.getElementById('result').classList.add('hidden');
 countdownEl.classList.remove('hidden');countText.className='countText';countText.textContent='';signalLights.forEach(l=>l.classList.remove('on'));
 for(let i=0;i<5;i++){
  signalLights[i].classList.add('on');countText.textContent=String(5-i);
  if(navigator.vibrate)navigator.vibrate(35);
  await sleep(650);
 }
 await sleep(350);
 signalLights.forEach(l=>l.classList.remove('on'));countText.textContent='GO!';countText.className='countText go';
 if(navigator.vibrate)navigator.vibrate([40,30,80]);
 await sleep(650);
 countdownEl.classList.add('hidden');countText.textContent='';countText.className='countText';
 running=true;last=performance.now();requestAnimationFrame(loop)
}
function finish(){running=false;const finalScore=Math.floor(score);let newRecord=false;if(finalScore>highScore){highScore=finalScore;localStorage.setItem('formulaHighScore',String(highScore));highScoreEl.textContent=highScore.toLocaleString('ja-JP');newRecord=true}if(player.rank===1&&difficulty===unlocked&&unlocked<20){unlocked++;localStorage.setItem('formulaUnlocked',String(unlocked));show('LEVEL '+unlocked+' 解放！')}updateDifficultyUI();document.getElementById('resultTitle').textContent=newRecord?'🏆 NEW RECORD!':(player.rank===1?'優勝！':'FINISH');document.getElementById('resultText').textContent=`LEVEL ${difficulty}　最終順位 ${player.rank}位　スコア ${finalScore.toLocaleString('ja-JP')}　最高 ${Math.floor(highScore).toLocaleString('ja-JP')}`;document.getElementById('result').classList.remove('hidden')}
function laneClear(car,target,allCars,margin=112){return !allCars.some(o=>o!==car&&o.lane===target&&Math.abs(o.progress-car.progress)<margin)}
function move(d){if(!running)return;const target=Math.max(0,Math.min(lanes-1,player.lane+d));if(target===player.lane)return;const all=[...rivals,...traffic];if(laneClear(player,target,all,130))player.lane=target;else show('前後の車が近すぎます')}
function useBoost(){if(!running||boost>0||boostCooldown>0||player.stun>0)return;boost=10;show('オーバーテイクモード 10秒！');if(navigator.vibrate)navigator.vibrate(30)}
function bind(id,fn){const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn()},{passive:false})}
bind('left',()=>move(-1));bind('right',()=>move(1));bind('boost',useBoost);document.getElementById('startBtn').onclick=start;document.getElementById('retry').onclick=()=>{document.getElementById('result').classList.add('hidden');document.getElementById('start').classList.remove('hidden')};
document.addEventListener('gesturestart',e=>e.preventDefault());let lt=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lt<300)e.preventDefault();lt=n},{passive:false});
function spawnTruck(){truck={lane:Math.floor(Math.random()*lanes),y:-210,w:92,h:180,angle:(Math.random()-.5)*.75,spin:(Math.random()>.5?1:-1)*.95};show('🚛 回転暴走トラック!!')}
function hit(a,b){return Math.abs(a.x-b.x)<(a.w+b.w)*.34&&Math.abs(a.y-b.y)<(a.h+b.h)*.34}
function findSafeLane(car,allCars){let choices=[0,1,2,3].filter(l=>l!==car.lane);choices.sort(()=>Math.random()-.5);for(const l of choices){if(laneClear(car,l,allCars,145))return l}return car.lane}
function spawnItemBox(){const lane=Math.floor(Math.random()*lanes);itemBoxes.push({lane,progress:player.progress+260+Math.random()*300,y:-80,x:0,w:44,h:44,spin:0})}
function grantItem(car,isPlayer=false){const r=Math.floor(Math.random()*3);if(r===0){car.shield=5;if(isPlayer)show('🛡 シールド 5秒')}else if(r===1){car.itemSpeed=8;if(isPlayer)show('⚡ スピードUP 8秒')}else{car.giant=8;if(isPlayer)show('🔴 巨大化！8秒間・体当たり無敵')}}
function resolveCarOverlaps(cars){for(let pass=0;pass<2;pass++)for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j];if(a.lane!==b.lane||a.giant>0||b.giant>0)continue;const minGap=((a.h||90)+(b.h||90))*.42;const gap=Math.abs(a.progress-b.progress);if(gap<minGap){const lead=a.progress>=b.progress?a:b,trail=lead===a?b:a;trail.progress=lead.progress-minGap;trail.speed=Math.min(trail.speed||0,(lead.speed||0)-2)}}}
function draftingBonus(car,cars){let nearest=9999;for(const o of cars){if(o===car||o.lane!==car.lane)continue;const gap=o.progress-car.progress;if(gap>48&&gap<235)nearest=Math.min(nearest,gap)}if(nearest===9999)return 0;return 5.5+(235-nearest)/187*4.5}
function knockAway(big,other){other.progress-=95;other.speed=Math.max(55,(other.speed||130)-45);const options=[big.lane-1,big.lane+1].filter(l=>l>=0&&l<lanes);if(options.length)other.lane=options[Math.floor(Math.random()*options.length)];if(other===player){player.stun=.45;shake=12}else if(big===player){score+=55}}
function updateCurve(){curveStrength=0;curveTarget=0;curveDir=0;}
function update(dt){
 t+=dt;if(t>=duration){finish();return}
 updateCurve(dt);
 roadScroll=(roadScroll+(260+(boost?150:0))*dt)%140;sceneryScroll=(sceneryScroll+(210+(boost?120:0))*dt)%180;
 if(boost>0){boost=Math.max(0,boost-dt);if(boost===0)boostCooldown=20}else boostCooldown=Math.max(0,boostCooldown-dt);
 player.stun=Math.max(0,player.stun-dt);player.shield=Math.max(0,player.shield-dt);player.itemSpeed=Math.max(0,player.itemSpeed-dt);player.giant=Math.max(0,player.giant-dt);
 const cfg=settings[difficulty];
 const allNPC=[...rivals,...traffic];
 const draft=draftingBonus(player,[player,...allNPC]);
 let ps=(player.stun?60:164)+(boost?86:0)+(player.itemSpeed?58:0)+(player.giant?28:0)+draft;const shownSpeed=ps*1.55;player.progress+=Math.max(55,ps)*dt;score+=Math.max(55,ps)*dt*.22;
 speedValue.textContent=Math.round(Math.max(55,ps)*1.55);speedMeter.classList.toggle('draft',draft>0);
 rivals.forEach((n,i)=>{
   n.boostTime=Math.max(0,n.boostTime-dt);n.boostCooldown=Math.max(0,n.boostCooldown-dt);n.shield=Math.max(0,n.shield-dt);n.itemSpeed=Math.max(0,n.itemSpeed-dt);n.giant=Math.max(0,n.giant-dt);
   if(n.boostTime===0&&n._wasBoosting){n.boostCooldown=20;n._wasBoosting=false}
   const gap=player.progress-n.progress;let target=n.baseSpeed;if(Math.abs(curveStrength)>.30){const skill=Math.min(.94,.58+difficulty*.018+(n.ace?.09:0));target-=28*(1-skill)+8;}
   const standings=contenders().slice().sort((a,b)=>b.progress-a.progress);

   if(playerLeading&&gap>-35&&gap<310){

   }

   const closeBattle=gap>-70&&gap<240;

   const dangerOfLosing=gap>55;
   const chance=cfg.boostChance*(dangerOfLosing?2.05:1)*(playerBoosting?1.6:1)*(playerLeading?1.35:1)*(n.ace?1.7:n.attacker?1.3:1);
   let forceAttack=false;
   if(playerLeading&&gap>-25&&gap<300&&n.boostTime<=0&&n.boostCooldown<=0){
     n.attackClock-=dt;
     if(n.attackClock<=0){

     }
   }else{
     const readySoon=n.ace?5:n.attacker?7:9;
     n.attackClock=Math.min(n.attackClock,readySoon+Math.random()*2);
   }
   if(n.boostTime<=0&&n.boostCooldown<=0&&closeBattle&&(forceAttack||Math.random()<chance)){
     n.boostTime=10;n._wasBoosting=true;
     n.lane=findSafeLane(n,[player,...allNPC]);
     if(forceAttack)show(n.ace?'🔥 強敵が仕掛けてきた！':'⚡ 後続車がオーバーテイク！');
   }
   n.progress+=n.speed*dt;n.y=H*.56-(n.progress-player.progress)*1.45;
   if(Math.random()<cfg.reaction*(gap>0?1.35:1))n.lane=findSafeLane(n,[player,...allNPC]);n.x=laneX(n.lane,n.y);
 });
 traffic.forEach(n=>{
   n.shield=Math.max(0,n.shield-dt);n.itemSpeed=Math.max(0,n.itemSpeed-dt);n.giant=Math.max(0,n.giant-dt);
   n.progress+=(n.speed+(n.itemSpeed?35:0)+(n.giant?22:0)+draftingBonus(n,[player,...allNPC]))*dt;n.y=H*.56-(n.progress-player.progress)*1.45;
   if(n.y>H+150||n.y<-190){n.progress=player.progress-(120+Math.random()*420);n.lane=Math.floor(Math.random()*lanes);n.speed=cfg.trafficSpeed[0]+Math.random()*(cfg.trafficSpeed[1]-cfg.trafficSpeed[0]);n.y=H+120}
   if(Math.random()<.0012*difficulty)n.lane=findSafeLane(n,[player,...allNPC]);n.x=laneX(n.lane,n.y);
 });
 player.x+=(laneX(player.lane,player.y)-player.x)*Math.min(1,dt*10);player.y=H-214;
 resolveCarOverlaps([player,...allNPC]);
 [player,...allNPC].forEach(car=>{if(car!==player)car.y=H*.56-(car.progress-player.progress)*1.45;car.x=laneX(car.lane,car.y)});
 nextBox-=dt;if(nextBox<=0){spawnItemBox();nextBox=4.5+Math.random()*3.5}
 itemBoxes.forEach(b=>{b.y=H*.56-(b.progress-player.progress)*1.45;b.x=laneX(b.lane,b.y);b.spin+=dt*3});
 const collectors=[player,...rivals,...traffic];
 itemBoxes=itemBoxes.filter(b=>{for(const car of collectors){const direct=car.lane===b.lane&&Math.abs(car.progress-b.progress)<42;if(direct){grantItem(car,car===player);if(car===player)score+=100;return false}}return b.y<H+120&&b.y>-120});
 nextTruck-=dt;if(nextTruck<0&&!truck){spawnTruck();nextTruck=15+Math.random()*8}if(truck){truck.y+=(320+(boost?70:0))*dt;truck.angle+=truck.spin*dt;truck.x=laneX(truck.lane,truck.y);if(hit(player,truck)){if(player.giant>0){score+=300;shake=15;show('💥 巨大化で暴走トラックを撃破！')}else if(player.shield>0){player.shield=0;show('🛡 シールドで防御！')}else{player.stun=3.2;player.progress-=125;player.crashSpin=1.15;crashFlash=.5;boost=0;boostCooldown=Math.max(boostCooldown,24);player.itemSpeed=0;score=Math.max(0,score-400);shake=24;show('💥 大クラッシュ！順位後退')}truck.y=H+300}allNPC.forEach(n=>{if(hit(n,truck)){if(n.giant>0){n.progress+=20}else if(n.shield>0)n.shield=0;else{n.progress-=105;n.boostTime=0;n.boostCooldown=Math.max(n.boostCooldown||0,12)}truck.y=H+300}});if(truck.y>H+260)truck=null}
 const cars=[player,...allNPC];for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j];if(a.lane!==b.lane)continue;const giantHit=Math.abs(a.progress-b.progress)<((a.h+b.h)*.48);if(giantHit&&(a.giant>0||b.giant>0)){if(a.giant>0&&b.giant<=0)knockAway(a,b);else if(b.giant>0&&a.giant<=0)knockAway(b,a);continue}if(Math.abs(a.progress-b.progress)<((a.h+b.h)*.40)){const lead=a.progress>=b.progress?a:b,trail=lead===a?b:a;trail.progress=lead.progress-(a.h+b.h)*.40;trail.speed=Math.min(trail.speed||0,(lead.speed||0)-1);if(trail===player&&player.shield<=0){player.stun=Math.max(player.stun,.18);score=Math.max(0,score-4)}}}
 player.crashSpin=Math.max(0,player.crashSpin-dt);crashFlash=Math.max(0,crashFlash-dt);shake*=.88;updateHud()
}

function drawScenery(){
 const topY=88;const bg=x.createLinearGradient(0,topY,0,H);bg.addColorStop(0,'#163b2a');bg.addColorStop(.48,'#1f5a35');bg.addColorStop(1,'#0f3a24');x.fillStyle=bg;x.fillRect(0,topY,W,H-topY);
 x.fillStyle='#13222c';for(let i=0;i<11;i++){const bw=18+(i%3)*8,bh=38+(i%5)*12,bx=i*(W/10)-10;x.fillRect(bx,topY-bh,bw,bh)}
 for(let side=0;side<2;side++)for(let i=0;i<7;i++){const y=topY+((i*130+sceneryScroll)% (H-topY+130))-70;const g=roadGeom(y);const p=g.p;const edge=side===0?g.cx-g.w/2:g.cx+g.w/2;const dir=side===0?-1:1;x.save();x.translate(edge+dir*(20+22*p),y);x.scale(.55+.7*p,.55+.7*p);if(i%3===0){x.fillStyle='#18212c';x.fillRect(dir<0?-64:0,-18,64,36);x.fillStyle='#d9e0e8';x.fillRect(dir<0?-60:4,-12,56,6);x.fillStyle='#ff2d82';x.fillRect(dir<0?-60:4,2,56,6)}else if(i%3===1){x.fillStyle='#26313c';x.fillRect(dir<0?-48:0,-18,48,36);for(let r=0;r<3;r++)for(let q=0;q<4;q++){x.fillStyle=['#ef4444','#facc15','#60a5fa','#f472b6'][(r+q+i)%4];x.beginPath();x.arc((dir<0?-41:7)+q*10,-10+r*9,2.8,0,7);x.fill()}}else{for(let q=0;q<3;q++){x.fillStyle='#0b1118';x.beginPath();x.arc(dir*(12+q*12),q*3,7,0,7);x.fill();x.strokeStyle='#697582';x.lineWidth=2;x.stroke()}}x.restore()}
}
function roadPerspective(){
 const topY=88;drawScenery();const roadPath=(extra=0)=>{x.beginPath();for(let y=topY;y<=H;y+=12){const rg=roadGeom(y);const xx=rg.cx-rg.w/2-extra*(.45+.55*rg.p);if(y===topY)x.moveTo(xx,y);else x.lineTo(xx,y)}for(let y=H;y>=topY;y-=12){const rg=roadGeom(y);x.lineTo(rg.cx+rg.w/2+extra*(.45+.55*rg.p),y)}x.closePath()};roadPath(13);x.fillStyle='#0008';x.fill();roadPath(0);const g=x.createLinearGradient(0,topY,0,H);g.addColorStop(0,'#3c4650');g.addColorStop(.42,'#252d35');g.addColorStop(1,'#11171d');x.fillStyle=g;x.fill();for(let y=topY+((roadScroll*.35)%48)-48;y<H;y+=48){const rg=roadGeom(y);x.strokeStyle='rgba(255,255,255,.025)';x.lineWidth=1+3*rg.p;x.beginPath();x.moveTo(rg.cx-rg.w/2,y);x.lineTo(rg.cx+rg.w/2,y);x.stroke()}for(let side=0;side<2;side++){for(let y=topY-40;y<H;y+=28){const yy=y+(roadScroll%56);const rg=roadGeom(yy),edge=side===0?rg.cx-rg.w/2:rg.cx+rg.w/2,dir=side===0?-1:1,w=5+8*rg.p;x.fillStyle=((Math.floor((yy+roadScroll)/28)%2)===0)?'#f4f5f7':'#e21d2d';x.fillRect(edge+(dir<0?-w:0),yy,w,28)}x.strokeStyle='#cdd5dc';x.lineWidth=2.5;x.beginPath();for(let y=topY;y<=H;y+=14){const rg=roadGeom(y),edge=side===0?rg.cx-rg.w/2:rg.cx+rg.w/2,dir=side===0?-1:1;const xx=edge+dir*(14+8*rg.p);if(y===topY)x.moveTo(xx,y);else x.lineTo(xx,y)}x.stroke()}for(let l=1;l<lanes;l++)for(let y=topY+((roadScroll+l*19)%120)-120;y<H;y+=120){const p=roadGeom(y).p;const rg=roadGeom(y),xx=rg.cx-rg.w/2+rg.w*l/lanes;x.strokeStyle='rgba(255,255,255,.92)';x.lineWidth=1.7+4.2*p;x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+35+46*p);x.stroke()}x.strokeStyle='rgba(0,0,0,.18)';for(let i=0;i<6;i++){x.lineWidth=2+i*.25;x.beginPath();for(let y=topY;y<H;y+=22){const rg=roadGeom(y),xx=rg.cx+Math.sin((y+roadScroll+i*43)/130)*rg.w*.12+(i-2.5)*5;if(y===topY)x.moveTo(xx,y);else x.lineTo(xx,y)}x.stroke()}}
function drawFormula(ctx,cx,cy,w,h,color,isPlayer=false,ang=0,rank=0,showRank=true){
 ctx.save();ctx.translate(cx,cy);ctx.rotate(ang);const s=w/84;ctx.scale(s,s);ctx.save();ctx.globalAlpha=.5;ctx.fillStyle='#000';ctx.filter='blur(5px)';ctx.beginPath();ctx.ellipse(0,15,43,70,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#06080b';[[-50,-43],[36,-43],[-52,12],[38,12]].forEach(([tx,ty])=>{roundedRect(ctx,tx,ty,14,34,4);ctx.fill();ctx.fillStyle='#222b33';ctx.fillRect(tx+2,ty+5,10,3);ctx.fillStyle='#06080b'});ctx.strokeStyle='#151b22';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-18,-29);ctx.lineTo(-42,-28);ctx.moveTo(18,-29);ctx.lineTo(42,-28);ctx.moveTo(-18,22);ctx.lineTo(-43,27);ctx.moveTo(18,22);ctx.lineTo(43,27);ctx.stroke();const accent=isPlayer?'#ff2d82':'#f1f5f9';ctx.fillStyle='#0a0d12';roundedRect(ctx,-48,-56,96,14,4);ctx.fill();roundedRect(ctx,-39,46,78,12,4);ctx.fill();ctx.fillStyle=accent;ctx.fillRect(-44,-52,88,4);ctx.fillRect(-35,48,70,4);const body=ctx.createLinearGradient(-30,-70,28,62);if(isPlayer){body.addColorStop(0,'#ffffff');body.addColorStop(.35,'#f2f4f7');body.addColorStop(.62,'#b8bec8');body.addColorStop(1,'#202630')}else{body.addColorStop(0,color);body.addColorStop(.48,color);body.addColorStop(1,'#1b2028')}ctx.fillStyle=body;ctx.beginPath();ctx.moveTo(0,-76);ctx.bezierCurveTo(9,-69,16,-58,17,-43);ctx.lineTo(26,-24);ctx.lineTo(29,28);ctx.bezierCurveTo(25,45,15,58,8,63);ctx.lineTo(-8,63);ctx.bezierCurveTo(-15,58,-25,45,-29,28);ctx.lineTo(-26,-24);ctx.lineTo(-17,-43);ctx.bezierCurveTo(-16,-58,-9,-69,0,-76);ctx.closePath();ctx.fill();ctx.fillStyle=isPlayer?'#151a22':'#252c35';ctx.beginPath();ctx.roundRect(-37,-12,16,47,7);ctx.fill();ctx.beginPath();ctx.roundRect(21,-12,16,47,7);ctx.fill();ctx.fillStyle=accent;ctx.beginPath();ctx.moveTo(-8,-67);ctx.lineTo(0,-74);ctx.lineTo(8,-67);ctx.lineTo(5,-27);ctx.lineTo(-5,-27);ctx.closePath();ctx.fill();ctx.fillRect(-23,18,46,7);ctx.fillStyle='#070b11';ctx.beginPath();ctx.ellipse(0,-12,13,30,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b8e3ff';ctx.beginPath();ctx.ellipse(0,-24,7.5,10.5,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=accent;ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,-17,12,Math.PI*.05,Math.PI*.95);ctx.stroke();ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(0,-4);ctx.stroke();ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-9,-58);ctx.lineTo(-13,12);ctx.stroke();ctx.beginPath();ctx.moveTo(9,-58);ctx.lineTo(13,12);ctx.stroke();if(isPlayer){ctx.fillStyle='#111';ctx.font='900 6px sans-serif';ctx.textAlign='center';ctx.fillText('RACING',0,-39);ctx.fillStyle='#ff2d82';ctx.fillRect(-18,31,36,4);ctx.fillStyle='#10151d';ctx.fillRect(-5,38,10,18)}if(showRank){const rc=rank===1?'#e7b816':rank===2?'#2f9cf4':rank===3?'#be3bd7':'#e24949';ctx.fillStyle=rc;roundedRect(ctx,-14,-99,28,24,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='900 15px sans-serif';ctx.textAlign='center';ctx.fillText(String(rank),0,-82)}ctx.restore()

function drawTruck(){if(!truck)return;x.save();x.translate(truck.x,truck.y);x.rotate(truck.angle);x.shadowColor='#000';x.shadowBlur=20;x.shadowOffsetY=14;x.fillStyle='#a51616';roundedRect(x,-truck.w/2,-truck.h/2,truck.w,truck.h,15);x.fill();x.shadowColor='transparent';x.fillStyle='#dce6f2';x.fillRect(-32,-66,64,42);x.fillStyle='#121722';x.fillRect(-51,-56,12,42);x.fillRect(39,-56,12,42);x.fillRect(-51,39,12,42);x.fillRect(39,39,12,42);x.fillStyle='#fff';x.font='900 18px sans-serif';x.textAlign='center';x.fillText('暴走',0,12);x.fillText('TRUCK',0,38);x.restore()}
function drawAura(car){
 if(car.giant>0){x.save();const pulse=.65+.35*Math.sin(t*13);x.globalAlpha=.45+.2*pulse;x.strokeStyle='#ff354f';x.lineWidth=6;x.shadowColor='#ff243f';x.shadowBlur=22;x.beginPath();x.ellipse(car.x,car.y,car.w*1.08,car.h*.82,0,0,Math.PI*2);x.stroke();x.restore()}
 if(car.shield>0){x.save();x.strokeStyle='#56c7ff';x.lineWidth=4;x.globalAlpha=.8;x.beginPath();x.ellipse(car.x,car.y,car.w*.72,car.h*.62,0,0,Math.PI*2);x.stroke();x.restore()}
 if(car.type==='rival'&&car.boostTime>0){
   x.save();
   const pulse=.65+.35*Math.sin(t*10+car.lane);
   x.globalAlpha=.72;
   x.strokeStyle='#ff7a18';x.lineWidth=3;
   x.beginPath();x.ellipse(car.x,car.y,car.w*.78,car.h*.66,0,0,Math.PI*2);x.stroke();
   x.globalAlpha=.8;
   const flame=x.createLinearGradient(car.x,car.y+car.h*.35,car.x,car.y+car.h*.9);
   flame.addColorStop(0,'#fff8a6');flame.addColorStop(.32,'#ff9d00');flame.addColorStop(1,'rgba(255,45,0,0)');
   x.fillStyle=flame;
   for(let i=-1;i<=1;i++){
     x.beginPath();x.moveTo(car.x+i*7-3,car.y+car.h*.38);x.lineTo(car.x+i*7+3,car.y+car.h*.38);x.lineTo(car.x+i*7+(Math.random()-.5)*5,car.y+car.h*(.65+.18*pulse));x.closePath();x.fill();

function draw(){x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);roadPerspective();const all=contenders().sort((a,b)=>b.progress-a.progress);itemBoxes.forEach(drawItemBox);traffic.forEach(n=>{const z=n.giant>0?1.5:1;drawFormula(x,n.x,n.y,42*z,82*z,n.color,false,0,0,false);drawAura(n)});rivals.forEach(n=>{const r=all.indexOf(n)+1,z=n.giant>0?1.5:1;drawFormula(x,n.x,n.y,50*z,98*z,n.color,false,0,r,true);drawAura(n)});drawTruck();const crashAngle=player.crashSpin>0?Math.sin(t*22)*.34*(player.crashSpin/1.15):0;const pz=player.giant>0?1.5:1;drawFormula(x,player.x,player.y,58*pz,114*pz,'#fff',true,crashAngle,all.indexOf(player)+1,true);drawAura(player);if(boost>0||player.itemSpeed>0||player.giant>0){x.save();x.globalAlpha=.78;x.fillStyle=boost?'#ff2d82':player.giant?'#ff354f':'#4ade80';for(let i=0;i<7;i++)x.fillRect(player.x-2+(Math.random()-.5)*15,player.y+55+i*10,5,24);x.restore()}if(crashFlash>0){x.save();x.globalAlpha=Math.min(.38,crashFlash*.75);x.fillStyle='#ff2a2a';x.fillRect(0,0,W,H);x.restore()}x.restore()}
